[package]
name = "class-recorder"
version = "0.1.0"
description = "Grabador, organizador y transcriptor de clases universitarias"
authors = ["Tomas"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "class_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset habilita asset://localhost para reproducir el audio guardado
# en disco directamente desde el <audio> del webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
sysinfo = "0.33"
# Descarga del motor y de los modelos de whisper (única parte que usa internet).
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Se usan solo para conceder el permiso de micrófono en WebView2.
# Las versiones tienen que coincidir con las de wry, porque los objetos COM
# vienen de ahí (tauri::webview::PlatformWebview::controller).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
