[package]
name = "class-recorder"
version = "0.7.0"
description = "Grabador, organizador y transcriptor de clases universitarias"
authors = ["Tomas"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "class_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset habilita asset://localhost para reproducir el audio guardado
# en disco directamente desde el <audio> del webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
sysinfo = "0.33"
# Descarga del motor y de los modelos de whisper, y llamadas a la API de
# transcripción externa que el usuario configure (las únicas partes que usan internet).
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
  "multipart",
  # El reconocimiento de apuntes por API va como JSON a chat/completions,
  # no como multipart: es otro tipo de endpoint que el de audio.
  "json",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Digitalización de apuntes escritos a mano. Se hace todo con crates de Rust
# puro en vez de OpenCV o un servicio de Python: el instalador tiene que seguir
# pesando pocos MB y no depender de nada instalado en el sistema, igual que el
# resto de la app.
#   image      decodificar la foto (con su orientación EXIF) y guardar el JPEG
#   imageproc  Canny, contornos, homografía y filtros de limpieza
# webp va incluido porque `EXTENSIONES_FOTO` lo acepta en el Inbox; sin la
# feature, el archivo entraba a la cola y recién moría al analizarlo.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.27", default-features = false }
# Marcadores ArUco de las esquinas. Se eligió por encima de `apriltag` (ata a
# una librería de C vía `apriltag-sys`) y de `aprilgrid` (arrastra 111 crates,
# incluido un codificador AV1 completo, porque usa `image` con todas sus
# features). Este suma 2 crates y es Rust puro: quien compila no instala nada.
aruco-rs = "0.1"

# Se usan solo para conceder el permiso de micrófono en WebView2.
# Las versiones tienen que coincidir con las de wry, porque los objetos COM
# vienen de ahí (tauri::webview::PlatformWebview::controller).
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# Detecta y fuerza la hidratación de placeholders de OneDrive (Archivos bajo
# demanda), y cifra la clave de la API de transcripción con DPAPI (ligada al
# usuario de Windows) para no guardarla en texto plano en config.json.
# Win32_Graphics_Imaging es WIC, que decodifica las fotos HEIC del iPhone: el
# crate `image` no lee HEIF y los decodificadores en Rust puro que existen son
# AGPL. Ver src/imagen_windows.rs.
windows = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
